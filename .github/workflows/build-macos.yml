name: build-macos

# Builds the two Racket apps on Apple Silicon and uploads the .app bundles.
#   - FluxusRacketApp    (JUCE-editor overlay + real Racket CS)
#   - FluxusGLRacketApp  (fluxus GLEditor + real Racket CS)
#
# These builds ARE self-contained: -DFLUXUS_BUNDLE_RACKET=ON copies the Racket CS
# runtime (boot files + collects + our .ss) into each .app under
# Contents/Resources/racket, so the artifacts run without minimal-racket installed
# (~+90 MB per app). Unsigned: on download, clear quarantine with
#   xattr -dr com.apple.quarantine FluxusRacketApp.app

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag push (e.g. v0.1.0) also publishes a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    permissions:
      contents: write   # create releases + upload assets on tag builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ninja minimal-racket

      - name: Resolve Racket prefix
        id: racket
        run: echo "prefix=$(brew --prefix minimal-racket)" >> "$GITHUB_OUTPUT"

      # Cache the CMake FetchContent deps (JUCE, FreeType, s7) — the biggest cost.
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        # CMAKE_POLICY_VERSION_MINIMUM=3.5: the fetched FreeType still declares
        # cmake_minimum_required(<3.5), which newer CMake on the runner rejects.
        # FLUXUS_BUNDLE_RACKET=ON copies the Racket runtime into each .app so the
        # released bundles run without `brew install minimal-racket`.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DFLUXUS_BUNDLE_RACKET=ON
          -DRACKET_DIR="${{ steps.racket.outputs.prefix }}"

      # BEFORE the build: the post-build bundling step copies racket-lib/ into the
      # .app, so the .zo must already exist or the bundle ships sources only.
      - name: Precompile the .ss library (faster first launch)
        run: make precompile RACKET="${{ steps.racket.outputs.prefix }}/bin/racket"

      - name: Build Racket apps
        run: cmake --build build --target FluxusRacketApp FluxusGLRacketApp

      - name: Check the bundles are self-contained
        run: |
          for a in FluxusRacketApp FluxusGLRacketApp; do
            d="build/${a}_artefacts/Release/${a}.app/Contents/Resources/racket"
            test -f "$d/lib/racket/racket.boot"          || { echo "$a: no boot files"; exit 1; }
            test -d "$d/share/racket/collects/racket"    || { echo "$a: no collects";   exit 1; }
            test -f "$d/etc/racket/config.rktd"          || { echo "$a: no config";     exit 1; }
            test -f "$d/fluxus-lib/fluxus-modules.ss"    || { echo "$a: no fluxus-lib"; exit 1; }
            n=$(find "$d/share/racket/collects" -name '*.zo' | wc -l | tr -d ' ')
            test "$n" -gt 100 || { echo "$a: only $n .zo in collects (compiled mirror missing)"; exit 1; }
            # The seal must cover the bundled runtime, or Gatekeeper rejects the
            # DOWNLOADED app as "damaged" (bundling after the linker's ad-hoc sign
            # breaks it; bundle_racket.cmake re-signs).
            codesign --verify --deep "build/${a}_artefacts/Release/${a}.app" \
              || { echo "$a: broken code signature"; exit 1; }
            echo "$a: OK ($n .zo, $(du -sh "$d" | cut -f1), signature valid)"
          done

      - name: Package .app bundles
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/FluxusRacketApp_artefacts/Release/FluxusRacketApp.app \
            dist/FluxusRacketApp.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/FluxusGLRacketApp_artefacts/Release/FluxusGLRacketApp.app \
            dist/FluxusGLRacketApp.zip
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxus-racket-apps-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

      # On a tag push (v*), publish a GitHub Release with the .app zips attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            macOS (Apple Silicon) builds of the Racket apps.

            Self-contained: the Racket CS runtime is bundled inside each `.app`
            (`Contents/Resources/racket`), so no `brew install minimal-racket` is
            needed. Unsigned: after download run
            `xattr -dr com.apple.quarantine <App>.app`.
