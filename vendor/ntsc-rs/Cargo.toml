# Workspace root for the vendored ntsc-rs core crate + our C FFI staticlib.
# ntscrs/Cargo.toml declares `lints.workspace = true`, so the lints table from
# the upstream workspace root is reproduced here.
[workspace]
members = ["ntscrs", "ffi"]
resolver = "2"

[workspace.lints.clippy]
too_many_arguments = "allow"
identity_op = "allow"
new_without_default = "allow"
module_inception = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
dbg_macro = "warn"

[profile.release]
lto = true
